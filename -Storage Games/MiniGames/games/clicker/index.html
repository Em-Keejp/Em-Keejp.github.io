<!DOCTYPE html>

<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>10秒間連打ゲーム</title>


<style>
    body {
        text-align: center;
        font-family: sans-serif;
    }

    #count {
        font-size: 40px;
        font-weight: 500;
        color:navy;
    }

    #timer {
        font-size: 24px;
        margin: 20px;
    }

    #clickButton {
        width: 400px;
        font-size: 30px;
        padding: 30px 30px;
        cursor: pointer;
    }

    body { text-align: center; background: #f0f0f0; font-family: sans-serif; }
        canvas { background: #fff; border: 2px solid #333; margin-top: 20px; }
        .info { margin-top: 10px; color: #666; }
</style>


</head>

<body>
<h1>10秒間連打ゲーム</h1>

<div id="timer">10秒以内に下のボタンを押しまくれ！</div>
<div id="count">0</div>

<br>
<button id="clickButton">クリック！</button>

<script>
    const timer = document.getElementById("timer");
    const count = document.getElementById("count");
    const clickButton = document.getElementById("clickButton");

    let clickCount = 0;
    let startTime;
    let finishTime;
    let gameRunning = false;

    // クリックボタン/開始ボタン
    clickButton.addEventListener("click", () => {

        if (gameRunning) {
            clickCount++;
            count.textContent = clickCount;
        }else{
            clickCount = 1;
            count.textContent = 1;

            startTime = Date.now();
            gameRunning = true;

            updateTimer();
        }
        
    });

    // タイマー更新
    function updateTimer() {

        if (!gameRunning) return;

        const elapsed = (Date.now() - startTime) / 1000;
        const remaining = 10 - elapsed;

        if (remaining <= 0) {

            timer.textContent = "終了！";
            count.textContent = "結果：" + clickCount + "連打！";
            clickButton.textContent = "クールダウン中";
            clickButton.disabled="true"
            gameRunning= false;     
            finishTime = Date.now();
            coolDown();

            return;
        }

        timer.textContent =
            "残り時間：" + remaining.toFixed(1) + "秒";

        requestAnimationFrame(updateTimer);
    }



    function coolDown(){

        const remaining = 2 - (Date.now() - finishTime) / 1000;

        if (remaining <= 0) {

            timer.textContent = "10秒以内に下のボタンを押しまくれ！";
            clickButton.disabled=false;
            clickButton.textContent="クリック！"

            return;
        }

        requestAnimationFrame(coolDown);
    }

</script>

</body>
</html>
