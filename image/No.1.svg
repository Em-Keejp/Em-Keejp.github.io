eight="normal" text-anchor="start"><tspan x="0" dy="0">@キングボンビー</tspan></text><text transform="translate(63.47486,155.76465) scale(0.22674,0.22674)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">グェッヘッヘ!　俺様はボンビラスの世界からやってきた　キングボンビーだ!</tspan><tspan x="0" dy="48px">質問コーナーをするんだってな?　俺様も混ぜてくれよ!</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">グェッヘッヘ、そうだな...</tspan><tspan x="0" dy="48px">・桃鉄で一番嫌いな俺様の悪行を教えてくれ!</tspan><tspan x="0" dy="48px">・桃鉄で一番苦手なボンビーは誰だ?　もちろん俺様だよな?!</tspan><tspan x="0" dy="48px">・これから先のお前の作品で俺様の出番はちゃんと用意してるか?</tspan><tspan x="0" dy="48px">まあ、エゴサーチはこれくらいにしてやるか!</tspan><tspan x="0" dy="48px">最後に一つ、「DecaDe-light」という言葉はどこから来たんだ?</tspan></text><path d="M-0.68334,361.22382v-362.44765h481.36668v362.44765z" fill="none" stroke="none" stroke-width="0" stroke-linecap="butt"></path></g></g></svg><!--rotationCenter:240.68334:181.223835-->